version: '3.8'

services:
  load_balancer:
    image: nginx:alpine
    ports:
      - "80:80" # For HTTP redirects
      - "443:443" # For secure HTTPS traffic
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx  # Maps local ./logs folder to container's log folder
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.crt:/etc/nginx/ssl/nginx.crt:ro
      - ./nginx.key:/etc/nginx/ssl/nginx.key:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - server1
      - server2
      - server3

  server1:
    image: nginx:alpine
  server2:
    image: nginx:alpine
  server3:
    image: nginx:alpine
